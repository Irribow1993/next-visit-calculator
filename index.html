<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183c5d"><title>次回来局予定日計算</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#1b2735;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:12px 14px 20px}
h1{font-size:18px;margin:0 0 8px}.top{position:sticky;top:0;z-index:5;background:#f4f6f8;padding:8px 0}.result{background:#183c5d;color:white;border-radius:12px;padding:12px 15px;box-shadow:0 4px 15px #10243a20}.result .hint{font-size:12px;opacity:.85}.result strong{font-size:clamp(21px,6vw,32px);display:block;line-height:1.3;margin:3px 0}.result .sub{font-size:13px}
.controls{display:flex;align-items:center;gap:10px;margin:9px 0}.controls label{font-size:13px;white-space:nowrap;font-weight:650}input{font:inherit;border:1px solid #bdc9d4;border-radius:9px;padding:8px;background:white;min-width:0}#base{flex:1;width:100%}
.buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.buttons button{background:#fff;border:1px solid #bdc9d4;border-radius:10px;padding:10px 1px;font-size:15px;min-height:44px;color:#183c5d;font-weight:600}.buttons button.active{background:#183c5d;color:white;border-color:#183c5d}
.foot{display:flex;align-items:center;gap:8px;margin-top:10px}.foot label{font-size:12px;white-space:nowrap}#days{width:76px;text-align:center}.copy{flex:1;background:#183c5d;color:white;border:0;border-radius:9px;padding:10px;font-size:14px;min-height:44px}.note{color:#667587;font-size:11px;margin:8px 0;line-height:1.5}#message{font-size:12px;color:#286346;min-height:15px}button:focus-visible,input:focus-visible{outline:3px solid #80b6df;outline-offset:2px}@media(min-width:600px){main{padding:22px}.buttons{gap:10px}.buttons button{padding:15px}}@media(max-width:350px){.buttons{gap:5px}.buttons button{font-size:13px}.result strong{font-size:21px}}
</style></head><body><main>
<div class="top"><h1>次回来局予定日計算</h1><section class="result" aria-live="polite"><div class="hint">次回来局予定日（目安）</div><strong id="date">—</strong><div class="sub" id="summary"></div></section></div>
<div class="controls"><label for="base">基準日</label><input id="base" type="date"></div><div class="buttons" id="buttons" aria-label="処方日数を選択"></div>
<div class="foot"><label for="days">日数入力</label><input id="days" type="number" min="1" max="3650" step="1" value="60"><button class="copy" id="copy">60日分をコピー</button></div><div id="message" aria-live="polite"></div><p class="note" id="end"></p><p class="note">処方日数以内の最大の7の倍数日後を表示。基準日を0日目として加算します。休診日・祝日・残薬・服薬開始日の変更は未考慮。患者情報は保存しません。</p>
</main><script>
"use strict";
const options=[...new Set([...Array.from({length:12},(_,i)=>28+i*7),30,60,90])].sort((a,b)=>a-b);
const base=document.querySelector("#base"),days=document.querySelector("#days"),buttons=document.querySelector("#buttons"),date=document.querySelector("#date"),summary=document.querySelector("#summary"),end=document.querySelector("#end"),copy=document.querySelector("#copy"),message=document.querySelector("#message");
const now=new Date();base.value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,"0"),String(now.getDate()).padStart(2,"0")].join("-");
function fmt(d){return new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short",timeZone:"UTC"}).format(d)}
function add(iso,n){const [y,m,d]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d+n,12))}
function render(){const n=Number(days.value),ok=Boolean(base.value)&&days.value.trim()!==""&&Number.isInteger(n)&&n>0&&n<=3650,offset=Math.floor(n/7)*7;
date.textContent=ok?fmt(add(base.value,offset)):"入力を確認してください";summary.textContent=ok?`${n}日処方 → ${offset}日後（${offset/7}週間後）`:"";end.textContent=ok?`参考：処方日数どおりの${n}日後は ${fmt(add(base.value,n))}`:"";copy.textContent=ok?`${n}日分をコピー`:"コピー";copy.disabled=!ok;buttons.querySelectorAll("button").forEach(b=>b.classList.toggle("active",Number(b.dataset.days)===n));message.textContent=""}
options.forEach(n=>{const b=document.createElement("button");b.type="button";b.dataset.days=n;b.textContent=n+"日";b.onclick=()=>{days.value=n;render()};buttons.append(b)});
base.addEventListener("change",render);days.addEventListener("input",render);copy.addEventListener("click",async()=>{const value=`${days.value}日分`;try{await navigator.clipboard.writeText(value);message.textContent=`コピーしました：${value}`}catch{const t=document.createElement("textarea");t.value=value;document.body.append(t);t.select();const success=document.execCommand("copy");t.remove();message.textContent=success?`コピーしました：${value}`:`コピーできませんでした：${value}`}});render();
</script></body></html>
