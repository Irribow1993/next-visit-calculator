<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>次回来局予定日計算</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;color:#1b2735;background:#f4f6f8}*{box-sizing:border-box}main{max-width:680px;margin:30px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 6px 30px #10243a12}h1{font-size:24px;margin:0 0 6px}.muted{color:#667587;font-size:13px}label{display:block;font-weight:650;margin:20px 0 8px}input{width:100%;padding:12px;font:inherit;border:1px solid #b9c5d2;border-radius:9px}.buttons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.buttons button{border:1px solid #ccd6df;background:#fff;padding:12px 2px;border-radius:9px;cursor:pointer;font-size:15px}.buttons button.active{background:#183c5d;color:white;border-color:#183c5d}.result{margin-top:22px;background:#eaf2f8;padding:18px;border-radius:12px}.result strong{display:block;font-size:26px;margin:6px 0}.result .line{margin-top:9px}button.copy{background:#183c5d;color:white;border:0;padding:12px 16px;border-radius:9px;cursor:pointer;margin-top:12px;width:100%;font-size:16px}#message{min-height:22px;color:#286346;font-size:13px;margin-top:6px}@media(max-width:460px){main{margin:0;min-height:100vh;border-radius:0;padding:20px}.buttons{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><main><h1>次回来局予定日計算</h1><div class="muted">処方日数以内の最大の7の倍数日後を表示します。患者情報は保存しません。</div><label for="base">基準日</label><input id="base" type="date"><label>処方日数（タップして選択）</label><div class="buttons" id="buttons"></div><label for="days">日数を直接入力</label><input id="days" type="number" min="1" max="3650" step="1" value="60"><div class="result"><div class="muted">次回来局予定日（目安）</div><strong id="date">—</strong><div id="summary"></div><div class="line muted" id="end"></div><button class="copy" id="copy">「60日分」をコピー</button><div id="message" aria-live="polite"></div></div><p class="muted">例：60日分→56日後、90日分→84日後。基準日を0日目として加算。休診日・祝日・残薬・服薬開始日の変更は考慮しません。</p></main><script>const options=[...new Set([...Array.from({length:12},(_,i)=>28+i*7),30,60,90])].sort((a,b)=>a-b);const base=document.querySelector('#base'),days=document.querySelector('#days'),buttons=document.querySelector('#buttons'),date=document.querySelector('#date'),summary=document.querySelector('#summary'),end=document.querySelector('#end'),copy=document.querySelector('#copy'),message=document.querySelector('#message');const now=new Date();base.value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');function fmt(d){return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short',timeZone:'UTC'}).format(d)}function add(iso,n){const [y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n,12))}function render(){const n=Number(days.value);const ok=base.value&&Number.isInteger(n)&&n>0&&n<=3650;const offset=Math.floor(n/7)*7;date.textContent=ok?fmt(add(base.value,offset)):'入力を確認してください';summary.textContent=ok?`${n}日処方 → ${offset}日後（${offset/7}週間後）`:'';end.textContent=ok?`参考：${n}日後は ${fmt(add(base.value,n))}`:'';copy.textContent=ok?`「${n}日分」をコピー`:'コピー';copy.disabled=!ok;buttons.querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.days)===n));message.textContent=''}options.forEach(n=>{const b=document.createElement('button');b.type='button';b.dataset.days=n;b.textContent=n+'日';b.onclick=()=>{days.value=n;render()};buttons.append(b)});base.addEventListener('change',render);days.addEventListener('input',render);copy.addEventListener('click',async()=>{const value=`${days.value}日分`;try{await navigator.clipboard.writeText(value);message.textContent=`コピーしました：${value}`}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();const success=document.execCommand('copy');t.remove();message.textContent=success?`コピーしました：${value}`:`コピーできませんでした：${value}`}});render();</script></body></html>
